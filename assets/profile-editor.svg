<svg xmlns="http://www.w3.org/2000/svg" width="380" height="780" viewBox="0 0 380 780" font-family="Roboto, system-ui, sans-serif">
  <defs><clipPath id="s3"><rect x="8" y="8" width="364" height="764" rx="34"/></clipPath></defs>
  <rect x="0" y="0" width="380" height="780" rx="42" fill="#1b1b21"/>
  <rect x="8" y="8" width="364" height="764" rx="34" fill="#fcf8ff"/>
  <g clip-path="url(#s3)">
    <rect x="8" y="8" width="364" height="60" fill="#fcf8ff"/>
    <text x="28" y="46" font-size="20" fill="#1b1b21">←</text>
    <text x="58" y="46" font-size="17" font-weight="600" fill="#1b1b21">Add profile</text>
    <text x="338" y="46" font-size="18" fill="#ba1a1a">🗑</text>

    <text x="28" y="92" font-size="11" font-weight="600" fill="#6750a4" letter-spacing="1">PROVIDER</text>
    <g font-size="12">
      <rect x="20" y="100" width="86" height="32" rx="16" fill="#6750a4"/>
      <text x="34" y="120" fill="#fff">LM Studio</text>
      <rect x="114" y="100" width="64" height="32" rx="16" fill="#eae7ef"/>
      <text x="128" y="120" fill="#47464f">Ollama</text>
      <rect x="186" y="100" width="62" height="32" rx="16" fill="#eae7ef"/>
      <text x="200" y="120" fill="#47464f">OpenAI</text>
      <rect x="256" y="100" width="60" height="32" rx="16" fill="#eae7ef"/>
      <text x="268" y="120" fill="#47464f">Custom</text>
    </g>

    <text x="28" y="164" font-size="11" font-weight="600" fill="#6750a4" letter-spacing="1">DETAILS</text>
    <rect x="20" y="174" width="340" height="52" rx="8" fill="#fff" stroke="#78767f"/>
    <text x="32" y="190" font-size="10" fill="#6750a4">Display name</text>
    <text x="32" y="210" font-size="13" fill="#1b1b21">Home desktop</text>

    <rect x="20" y="234" width="340" height="52" rx="8" fill="#fff" stroke="#6750a4" stroke-width="2"/>
    <text x="32" y="250" font-size="10" fill="#6750a4">Base URL</text>
    <text x="32" y="270" font-size="13" fill="#1b1b21">http://192.168.1.20:1234/v1</text>

    <rect x="20" y="294" width="340" height="52" rx="8" fill="#fff" stroke="#78767f"/>
    <text x="32" y="310" font-size="10" fill="#6750a4">API key</text>
    <text x="32" y="330" font-size="13" fill="#78767f">•••••••• (saved)            👁</text>
    <text x="22" y="362" font-size="10.5" fill="#47464f">🔒 Encrypted with the Android Keystore — never leaves the device.</text>

    <text x="28" y="392" font-size="11" font-weight="600" fill="#6750a4" letter-spacing="1">MODEL</text>
    <rect x="20" y="402" width="340" height="52" rx="8" fill="#fff" stroke="#78767f"/>
    <text x="32" y="418" font-size="10" fill="#6750a4">Model id</text>
    <text x="32" y="438" font-size="13" fill="#1b1b21">qwen2.5-7b-instruct</text>
    <g font-size="11">
      <rect x="20" y="462" width="150" height="30" rx="15" fill="#6750a4"/>
      <text x="32" y="481" fill="#fff">qwen2.5-7b-instruct</text>
      <rect x="178" y="462" width="120" height="30" rx="15" fill="#eae7ef"/>
      <text x="190" y="481" fill="#47464f">llama-3.1-8b</text>
    </g>

    <!-- Toggle -->
    <text x="22" y="520" font-size="13.5" fill="#1b1b21">Set as default profile</text>
    <rect x="312" y="508" width="40" height="22" rx="11" fill="#6750a4"/>
    <circle cx="343" cy="519" r="8" fill="#fff"/>

    <!-- Test connection -->
    <rect x="20" y="544" width="340" height="44" rx="22" fill="#fcf8ff" stroke="#6750a4"/>
    <text x="150" y="571" font-size="13.5" fill="#6750a4">⚡ Test connection</text>
    <text x="32" y="610" font-size="12.5" fill="#2e7d32">✓ Connected — 3 model(s) available</text>

    <!-- Save -->
    <rect x="20" y="634" width="340" height="48" rx="24" fill="#6750a4"/>
    <text x="150" y="664" font-size="14.5" font-weight="600" fill="#fff">Save profile</text>
  </g>
</svg>
